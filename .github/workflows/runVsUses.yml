name: runVsUses

on:
  workflow_dispatch:

jobs:
  primero:
    runs-on: ubuntu-latest

    steps:
      - name: Mostrar directorio actual
        run: pwd # Ejecuta un comando directamente en el runner.

      - name: Descargar repositorio
        uses: actions/checkout@v4 # uses sirve para utilizar una Action que ya existe.

      - name: Mostrar archivos
        run: ls

  segundo:
    needs: primero
    runs-on: ubuntu-latest

    steps:
      - name: Segundo job
        run: echo "Este es el segundo job"
